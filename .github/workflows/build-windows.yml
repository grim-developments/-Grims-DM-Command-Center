
name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Grims_DM_Windows_App_V40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Release tag must match package.json version."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Build Windows installer and update files
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            Get-ChildItem "dist" -File |
            Where-Object {
              $_.Extension -in @(".exe", ".blockmap") -or
              $_.Name -eq "latest.yml"
            } |
            ForEach-Object { $_.FullName }
          )

          if (-not ($files | Where-Object { $_ -like "*.exe" })) {
            throw "Installer EXE was not generated."
          }

          if (-not ($files | Where-Object { $_ -like "*latest.yml" })) {
            throw "Updater metadata latest.yml was not generated."
          }

          gh release view $tag --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release $tag does not exist."
          }

          gh release upload $tag @files --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets."
          }

      - name: Upload manual build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Grims-DM-Windows-Installer
          path: |
            Grims_DM_Windows_App_V40/dist/*.exe
            Grims_DM_Windows_App_V40/dist/latest.yml
            Grims_DM_Windows_App_V40/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
