
name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to repair (leave blank for a normal build)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Grims_DM_Windows_App_V40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release tag
        id: release
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = ""
          if ($env:MANUAL_TAG) {
            $tag = $env:MANUAL_TAG.Trim()
          } elseif ($env:GIT_REF.StartsWith("refs/tags/")) {
            $tag = $env:REF_NAME
          }
          if ($tag -and $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Verify release version
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "package.json version $version does not match release $env:RELEASE_TAG"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Build Windows installer and update files
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload files to GitHub Release
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $files = @(
            Get-ChildItem "dist" -File |
            Where-Object {
              $_.Extension -in @(".exe", ".blockmap") -or
              $_.Name -eq "latest.yml"
            } |
            ForEach-Object { $_.FullName }
          )

          if (-not ($files | Where-Object { $_ -like "*.exe" })) {
            throw "Installer EXE was not generated."
          }

          if (-not ($files | Where-Object { $_ -like "*latest.yml" })) {
            throw "latest.yml was not generated."
          }

          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Release does not exist."
          }

          gh release upload $env:RELEASE_TAG @files --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release files."
          }

      - name: Upload manual build artifact
        if: steps.release.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: Grims-DM-Windows-Installer
          path: |
            Grims_DM_Windows_App_V40/dist/*.exe
            Grims_DM_Windows_App_V40/dist/latest.yml
            Grims_DM_Windows_App_V40/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
